name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Ruff
        run: python -m ruff check .

  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout || 30 }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The README promises Python 3.10 or later, so test the oldest and newest.
          - { os: ubuntu-latest, python: "3.10", experimental: false }
          - { os: ubuntu-latest, python: "3.13", experimental: false }
          # Coverage is measured once, on the current interpreter.
          - { os: ubuntu-latest, python: "3.13", coverage: true, experimental: false }
          - { os: macos-latest, python: "3.13", experimental: false }
          # Windows has not been run before. It reports results without blocking
          # merges until it is known to pass; remove experimental once it does.
          # Windows is slower here, and one module can block the whole session,
          # so it runs one test module per process until it has a green run.
          - { os: windows-latest, python: "3.13", experimental: true, timeout: 55, by_file: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run the full suite
        if: ${{ !matrix.coverage && !matrix.by_file }}
        run: python run_tests.py
      - name: Run the full suite, one module at a time
        if: ${{ matrix.by_file }}
        run: python ci/suite_by_file.py
      - name: Run the full suite with coverage
        if: ${{ matrix.coverage }}
        run: python -m pytest --cov --cov-report=term-missing --cov-fail-under=88
